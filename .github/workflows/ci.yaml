name: Build, Test, and deploy

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:


permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run C++ tests
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        name: Checkout repository

      - name: Install native dependencies for C++ tests
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfftw3-dev libboost-filesystem-dev libboost-test-dev

      - name: Build and run C++ tests
        run: ./bin/run-cpp-tests.sh

  prepare-arm-performance-libraries:
    runs-on: ubuntu-22.04
    name: Download and prepare ARM Performance Libraries
    strategy:
      matrix:
        target_platform:
          - linux_gcc
          - macos
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        name: Checkout repository

      - name: Restore cached ARM sources and libraries
        id: cache-armpl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build-packages/arm-performance-libraries/dist
          key: armpl-${{ matrix.target_platform }}-${{ hashFiles('build-packages/arm-performance-libraries/hatch_build.py', 'build-packages/arm-performance-libraries/pyproject.toml') }}

      - name: Install zsh
        # The installation script for ARM Performance Libraries on macOS uses zsh
        if: steps.cache-armpl.outputs.cache-hit != 'true' && matrix.target_platform == 'macos'
        run: sudo apt-get install -y zsh

      - name: Set up Python
        if: steps.cache-armpl.outputs.cache-hit != 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.x"

      - name: Download ARM Performance Libraries and extract relevant headers and libraries
        if: steps.cache-armpl.outputs.cache-hit != 'true'
        env:
          ARMPL_TARGET_PLATFORM: ${{ matrix.target_platform }}
        working-directory: 'build-packages/arm-performance-libraries/'
        run: |
          pip install build
          python -m build --wheel

      - name: Store headers and libraries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: arm-performance-libraries-${{ matrix.target_platform }}
          path: build-packages/arm-performance-libraries/dist/*.whl
          if-no-files-found: error

  build:
    needs:
      - test
      - prepare-arm-performance-libraries
    runs-on: ${{ matrix.os }}
    name: Build & Test
    strategy:
      matrix:
        os:
        - ubuntu-22.04
        - ubuntu-22.04-arm
        # Intel based
        - macos-15-intel
        # ARM based
        - macos-15
        - windows-2022

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        name: Checkout repository
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Download ARM Performance Libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        if: ${{ (startsWith(matrix.os, 'macos-') && ! endsWith(matrix.os, '-intel')) || endsWith(matrix.os, '-arm') }}
        with:
          pattern: arm-performance-libraries-*
          path: build-packages/arm-performance-libraries/dist
          merge-multiple: true

      - name: Build wheels
        uses: pypa/cibuildwheel@8d2b08b68458a16aeb24b64e68a09ab1c8e82084  # v3.4.1
        env:
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_SKIP: "*-musllinux_*"  # Currently, OpenBLAS (via scipy) does not support musl
          CIBW_ENABLE: "pypy"
        with:
          output-dir: 'dist'

      - name: Store wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  source-distribution:
    runs-on: ubuntu-22.04
    name: Create source distribution (sdist)

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        name: Checkout repository
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.7"  # Minimum supported version

      - name: Create source distribution
        run: |
          pip install build
          python -m build --sdist

      - name: Store source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  check-created-artifacts:
    runs-on: ubuntu-22.04
    name: Check that all the created artifacts have a consistent version
    needs:
      - build
      - source-distribution
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        name: Checkout repository
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Download compiled wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: wheels-*
          path: .
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sdist

      - name: Gather wheels and source distribution
        run: |
          mkdir -p dist/
          mv *.whl dist/
          mv *.tar.gz dist/

      - name: Ensure artifacts have consistent version
        run: ./bin/ensure-consistent-version.sh

      - name: Package all artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: distribution
          path: dist/
          if-no-files-found: error

  publish:
    runs-on: ubuntu-22.04
    name: Publish wheels, and source to PyPi
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    needs:
      - check-created-artifacts
    # Specifying a GitHub environment is optional, but strongly encouraged
    environment: release
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: distribution
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
